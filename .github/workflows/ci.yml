name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/reiki-knowledge-base

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Reiki knowledge base
        run: npm run validate:knowledge

      - name: Build
        run: npm run build
