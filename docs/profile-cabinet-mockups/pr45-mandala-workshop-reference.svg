<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="790" viewBox="0 0 1400 790" role="img" aria-label="PR45 mandala workshop reference mockup">
  <title>PR45 Mandala Workshop Reference</title>
  <rect width="1400" height="790" fill="#fbf4e6"/>
  <g opacity=".16" stroke="#b8791d" fill="none"><path d="M0 70h1400M0 190h1400M0 670h1400M100 0l100 790M1280 0l-100 790"/></g>
  <text x="700" y="26" text-anchor="middle" font-family="Georgia" font-size="15" fill="#6b4210" font-weight="700">REIKI YGGDRASIL</text>
  <text x="700" y="56" text-anchor="middle" font-family="Georgia" font-size="32" fill="#2b1b0c" font-weight="700">Кабинет мастера</text>
  <rect x="22" y="75" width="1356" height="105" rx="18" fill="#261302" stroke="#b8791d"/>
  <circle cx="120" cy="127" r="48" fill="#3a2107" stroke="#d49a35"/>
  <text x="120" y="137" text-anchor="middle" font-size="48" fill="#f8d073">♣</text>
  <text x="235" y="120" font-family="Georgia" font-size="33" fill="#fff3c9" font-weight="700">Мастерская мандал</text>
  <text x="235" y="150" font-family="Georgia" font-size="17" fill="#f6d487">Создавайте мандалы, артефакты и практики по ступеням Рейки Иггдрасиль.</text>
  <g font-family="Georgia" fill="#fff3c9"><rect x="790" y="97" width="170" height="60" rx="14" fill="#3b2409" stroke="#a66a18"/><text x="820" y="122" font-size="28">3</text><text x="820" y="145" font-size="14">Черновики</text><rect x="975" y="97" width="170" height="60" rx="14" fill="#3b2409" stroke="#a66a18"/><text x="1005" y="122" font-size="28">1</text><text x="1005" y="145" font-size="14">На модерации</text><rect x="1160" y="97" width="170" height="60" rx="14" fill="#3b2409" stroke="#a66a18"/><text x="1190" y="122" font-size="28">2</text><text x="1190" y="145" font-size="14">Опубликовано</text></g>
  <rect x="22" y="195" width="1356" height="100" rx="16" fill="#fffaf0" stroke="#deb25d"/>
  <text x="42" y="230" font-family="Georgia" font-size="16" fill="#9a6214" font-weight="700">✧ НАСТРОЙКА ПОТОКА</text>
  <rect x="42" y="250" width="410" height="40" rx="8" fill="#fff" stroke="#d9c39f"/><text x="55" y="276" font-family="Georgia" font-size="15" fill="#2b1b0c">1. Базовая программа Рейки Иггдрасиль</text>
  <rect x="486" y="250" width="410" height="40" rx="8" fill="#fff" stroke="#d9c39f"/><text x="500" y="276" font-family="Georgia" font-size="15" fill="#2b1b0c">2. Очищение · Зарядка объекта</text>
  <rect x="940" y="208" width="420" height="72" rx="14" fill="#fff6dc" stroke="#dba13e"/><circle cx="985" cy="244" r="31" fill="#2b1704" stroke="#dba13e"/><text x="985" y="253" text-anchor="middle" fill="#f9d276" font-size="24">✦</text><text x="1030" y="232" font-family="Georgia" font-size="14" fill="#a66a18" font-weight="700">Текущий поток</text><text x="1030" y="258" font-family="Georgia" font-size="21" fill="#2b1b0c" font-weight="700">RY-L01-S02</text>
  <rect x="22" y="310" width="510" height="400" rx="16" fill="#fffaf0" stroke="#e1c17b"/><text x="42" y="342" font-family="Georgia" font-size="16" fill="#9a6214" font-weight="700">♧ АЛТАРЬ МАНДАЛЫ</text><circle cx="175" cy="475" r="115" fill="#fff8e8" stroke="#e1b355"/><circle cx="175" cy="475" r="42" fill="#fff"/><text x="175" y="493" text-anchor="middle" font-size="44" fill="#7d4b0b">⇧</text><text x="315" y="390" font-family="Georgia" font-size="15" fill="#2b1b0c">Загрузите вашу мандалу для</text><text x="315" y="410" font-family="Georgia" font-size="15" fill="#2b1b0c">выбранной ступени и настройки.</text><rect x="315" y="428" width="220" height="38" rx="12" fill="#b8791d"/><text x="425" y="452" text-anchor="middle" font-family="Georgia" font-size="15" fill="#fff3c9" font-weight="700">Загрузить фото мандалы</text><rect x="315" y="485" width="220" height="88" rx="10" fill="#fff7e6" stroke="#e1b355" stroke-dasharray="5 4"/><text x="425" y="535" text-anchor="middle" font-family="Georgia" font-size="14" fill="#7d4b0b">drag / drop image</text><rect x="42" y="640" width="470" height="48" rx="10" fill="#fff6dc" stroke="#dba13e"/><text x="62" y="670" font-family="Georgia" font-size="15" fill="#5b3810">Мандала будет привязана к выбранной настройке потока.</text>
  <rect x="546" y="310" width="310" height="400" rx="16" fill="#fffaf0" stroke="#e1c17b"/><text x="566" y="342" font-family="Georgia" font-size="16" fill="#9a6214" font-weight="700">☼ СОЗДАНИЕ МАТЕРИАЛА</text><rect x="566" y="365" width="88" height="34" rx="17" fill="#8a5308"/><text x="610" y="386" text-anchor="middle" font-family="Georgia" font-size="13" fill="#fff3c9">Мандала</text><rect x="664" y="365" width="88" height="34" rx="17" fill="#fff3d2" stroke="#dfbf78"/><text x="708" y="386" text-anchor="middle" font-family="Georgia" font-size="13" fill="#5a3710">Артефакт</text><rect x="762" y="365" width="75" height="34" rx="17" fill="#fff3d2" stroke="#dfbf78"/><text x="799" y="386" text-anchor="middle" font-family="Georgia" font-size="13" fill="#5a3710">Практика</text><rect x="566" y="430" width="270" height="34" rx="7" fill="#fff" stroke="#d8c4a4"/><rect x="566" y="500" width="270" height="80" rx="7" fill="#fff" stroke="#d8c4a4"/><rect x="566" y="610" width="130" height="38" rx="9" fill="#fff" stroke="#dba13e"/><text x="631" y="634" text-anchor="middle" font-family="Georgia" font-size="13" fill="#9a6214">Сохранить</text><rect x="710" y="610" width="126" height="38" rx="9" fill="#b8791d"/><text x="773" y="634" text-anchor="middle" font-family="Georgia" font-size="13" fill="#fff3c9">На модерацию</text>
  <rect x="870" y="310" width="508" height="400" rx="16" fill="#fffaf0" stroke="#e1c17b"/><text x="890" y="342" font-family="Georgia" font-size="16" fill="#9a6214" font-weight="700">♧ МОИ МАНДАЛЫ И МАТЕРИАЛЫ</text><g font-family="Georgia"><rect x="890" y="365" width="150" height="195" rx="10" fill="#fff" stroke="#e2cfaa"/><rect x="890" y="365" width="150" height="80" rx="10" fill="#2b1704"/><text x="965" y="413" text-anchor="middle" fill="#f8d073" font-size="34">✺</text><text x="905" y="470" font-size="14" fill="#2b1b0c" font-weight="700">Мандала денежной</text><text x="905" y="490" font-size="14" fill="#2b1b0c" font-weight="700">активации</text><text x="905" y="525" font-size="12" fill="#9a6214">RY-L01-S02 · Очищение</text><rect x="1055" y="365" width="150" height="195" rx="10" fill="#fff" stroke="#e2cfaa"/><rect x="1055" y="365" width="150" height="80" rx="10" fill="#0d4360"/><text x="1130" y="413" text-anchor="middle" fill="#bfe8ff" font-size="34">✺</text><text x="1070" y="470" font-size="14" fill="#2b1b0c" font-weight="700">Мандала защиты</text><text x="1070" y="525" font-size="12" fill="#9a6214">RY-L01-S03 · pending</text><rect x="1220" y="365" width="138" height="195" rx="10" fill="#fff" stroke="#e2cfaa"/><rect x="1220" y="365" width="138" height="80" rx="10" fill="#1e1931"/><text x="1289" y="413" text-anchor="middle" fill="#d8c2ff" font-size="34">◇</text><text x="1235" y="470" font-size="14" fill="#2b1b0c" font-weight="700">Артефакт</text><text x="1235" y="490" font-size="14" fill="#2b1b0c" font-weight="700">очищения</text></g><rect x="890" y="575" width="160" height="115" rx="10" fill="#fff7e6" stroke="#e1b355" stroke-dasharray="5 4"/><text x="970" y="630" text-anchor="middle" font-size="38" fill="#b8791d">＋</text><text x="970" y="662" text-anchor="middle" font-family="Georgia" font-size="13" fill="#7d4b0b">Добавьте первую мандалу</text>
  <rect x="22" y="722" width="1356" height="42" rx="12" fill="#fff3d1"/><text x="60" y="748" font-family="Georgia" font-size="15" fill="#2b1b0c">Подсказка мастеру: настройтесь на выбранную ступень, загрузите изображение, опишите действие и сохраните черновик.</text>
</svg>